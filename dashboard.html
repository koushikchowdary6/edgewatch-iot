<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EdgeWatch | Device telemetry</title>
<style>body{background:#0d1726;color:#e9f1fa;font:16px system-ui;max-width:1100px;margin:50px auto;padding:20px}h1{font-size:42px;margin-bottom:8px}small{color:#9ab0c8}button,input{padding:12px;background:#20344e;color:white;border:1px solid #58718e;border-radius:6px}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{text-align:left;padding:13px;border-bottom:1px solid #294057}.alert{color:#ffb870}#status{margin:24px 0;color:#83dbb7}</style>
<h1>EdgeWatch</h1><p>Device telemetry · persistent ingestion · replay detection</p><small>Software-only demonstration. Values come from a synthetic device, not physical ESP32 hardware.</small>
<p><input id="key" type="password" aria-label="API key" placeholder="Session API key" autocomplete="off"> <button id="load">Refresh telemetry</button></p><p id="status">Connect to inspect the latest 200 records.</p>
<table><thead><tr><th>Device</th><th>Sequence</th><th>Temperature °C</th><th>Voltage V</th><th>Alert</th></tr></thead><tbody id="rows"></tbody></table>
<script>document.querySelector('#load').onclick=async()=>{const s=document.querySelector('#status');try{const r=await fetch('/api/samples',{headers:{'X-API-Key':document.querySelector('#key').value}});if(!r.ok)throw Error('Request failed: '+r.status);const data=await r.json();document.querySelector('#rows').replaceChildren(...data.map(x=>{const tr=document.createElement('tr');for(const k of ['device','seq','temperature','voltage','alert']){const td=document.createElement('td');td.textContent=x[k]|| (k==='alert'?'Normal':x[k]);if(k==='alert'&&x[k])td.className='alert';tr.append(td)}return tr}));s.textContent=data.length+' records loaded · '+data.filter(x=>x.alert).length+' flagged records'}catch(e){s.textContent=e.message}};</script></html>
